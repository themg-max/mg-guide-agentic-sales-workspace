[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mg-guide-agentic-sales-workspace-phase1"
version = "0.1.0"
description = "meeting_follow_up_v1 foundation + Phase 3 Google ADK runtime / Meeting + Relationship Context Agents (synthetic fixtures; optional live Gemini)"
requires-python = ">=3.9"
dependencies = [
  "jsonschema==4.23.0",
  "PyYAML==6.0.2",
  "google-adk==1.18.0",
  "google-cloud-firestore==2.27.0",
  "google-cloud-secret-manager==2.27.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]
gemini = ["google-genai>=1.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
