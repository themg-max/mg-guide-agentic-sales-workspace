name: NW-008 AT1 GHL workflow identity diagnostic

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  workflow-identity-diagnostic:
    name: Validate workflow-to-runtime identity
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install repository dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Authenticate as the dedicated GHL workflow identity
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/831270426395/locations/global/workloadIdentityPools/github-actions-pool-v2/providers/mg-guide-github-provider-v1
          service_account: mg-guide-ghl-workflow@ai-rolodex-to-crm.iam.gserviceaccount.com
          create_credentials_file: "true"
          cleanup_credentials: "true"
          export_environment_variables: "false"

      - name: Run the one-shot identity diagnostic
        env:
          MG_GUIDE_NW008_GHL_WORKFLOW_CREDENTIAL_CONFIG: ${{ steps.auth.outputs.credentials_file_path }}
          PYTHONPATH: src
        run: python -m integrations.ghl.highlevel_rest.workflow_identity_diagnostic
