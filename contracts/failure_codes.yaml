# meeting_follow_up_v1 — failure / block reason codes
# All listed paths fail closed: no further CRM writes after the code is raised.
# Phase 1: codes are first-class in deterministic policy; no live GHL activation.

workflow: meeting_follow_up_v1
schema_version: 2
default_posture: fail_closed

codes:
  AMBIGUOUS_CONTACT:
    http_semantics: n/a
    terminal_status: blocked
    crm_writes_after: 0
    description: >
      Contact resolution returned more than one plausible candidate.
      LLM must not pick the closest match.
    demo_fixture: transcript-ambiguous-contact.txt

  AMBIGUOUS_OPPORTUNITY:
    http_semantics: n/a
    terminal_status: blocked
    crm_writes_after: 0
    description: >
      A uniquely matched contact has multiple eligible open opportunities.
      Resolver must select none, set no stage target, and require review.
    demo_fixture: transcript-ambiguous-opportunity.txt

  CONTACT_NOT_FOUND:
    terminal_status: blocked
    crm_writes_after: 0
    description: No contact could be resolved from participant identifiers.

  OPPORTUNITY_NOT_FOUND:
    terminal_status: blocked
    crm_writes_after: 0
    description: Matched contact lacks the expected opportunity record for the slice.

  LOW_EXTRACTION_CONFIDENCE:
    terminal_status: blocked
    crm_writes_after: 0
    description: >
      Extraction confidence is below extraction_abort_threshold (distinct from
      stage_transition_confidence_min). Run blocks before CRM resolution.

  STAGE_TRANSITION_NOT_ALLOWED:
    terminal_status: completed_with_review
    crm_writes_after: note_only_if_already_authorized
    description: >
      Note write may still proceed when allowed, but opportunity stage must remain
      unchanged. Recorded as a first-class reason, not a silent skip.

  NOTE_WRITE_BLOCKED:
    terminal_status: blocked
    crm_writes_after: 0
    description: >
      Deterministic policy denied note write and no other permitted mutation
      action remains. Explicit, auditable denial.

  GHL_TOOL_FAILURE:
    terminal_status: failed
    crm_writes_after: 0
    description: >
      GHL MCP tool call failed during an attempted mutation or required read.
      Representable in Phase 1 via fixture stub; live GHL is not activated.

  GHL_WRITE_NOT_VERIFIED:
    terminal_status: failed
    crm_writes_after: 0
    description: >
      Mutation tool reported success but read-back verification did not confirm
      the expected CRM state. Completion must not be declared.

aliases:
  BLOCKED_CONTACT_AMBIGUOUS: AMBIGUOUS_CONTACT
